name: Oopz Talking
author: luckyumimi
tags: [UI]
punchline: FF14 小队列表直接显示 oopz 语音房里谁在说话、谁静音了。
IconUrl: https://raw.githubusercontent.com/Luckyumimi/MyDalamudPlugins/master/plugins/OopzTalking/icon.png
description: >-
    连接 oopz 本机 WebSocket (127.0.0.1:10274)，把语音房间里的说话/静音状态画到 FF14
    小队列表上：绿框=正在说话，蓝框=静音，黄框=名字没对上。


    只需 oopz 昵称与游戏角色名一致（或包含角色名的第一/最后一个字），即可自动匹配；
    也可以在设置里手动绑定角色名到 oopz 成员名。


    数据源与本机 oopz 客户端直连，不出机器。